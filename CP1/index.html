<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game Đơn Giản</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Khung hiển thị điểm số -->
    <div class="score-board">Score: <span id="score">0</span></div>
    
    <!-- Dòng chữ thông báo kết quả (nằm dưới Score) -->
    <div id="message" class="message-text">Cách chơi: Hãy tìm các cặp màu giống nhau!</div>
    
    <!-- Khung Grid chứa các ô màu -->
    <div id="game-grid" class="grid"></div>

    <script src="script.js"></script>
</body>
</html>
