<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mondrian Grid Layout</title>
  <style>
    
    .grid-container {
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 20px; 
      background-color: #f5f5f5;
      padding: 20px;
    }

    .grid-container > div {
      background-color: #9abafd;
      border-radius: 6px;
      padding: 15px;
      text-align: center;
      font-family: sans-serif;
      font-size: 14px;
      color: #333;
    }

    /* Grid Items */
    .item1 {
      grid-column: 1 / 3; 
    }

    .item2 {
      grid-column: 3 / 4;
    }

    .item3 {
      grid-column: 1 / 4; 
      grid-row: 2 / 3;[cite: 5]
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="item1">Item 1</div>
    <div class="item2">Item 2</div>
    <div class="item3">Item 3</div>
  </div>

</body>
</html>
